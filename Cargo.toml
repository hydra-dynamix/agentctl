[package]
name = "agentctl"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Compact, bounded command and agent reports for LLM tool loops"
readme = "README.md"
documentation = "https://docs.rs/agentctl"
keywords = ["cli", "agents", "llm", "testing", "summary"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".ldgr/", "docs/"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.23"
ureq = { version = "2.12.1", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.20.0"

[workspace]
