[package]
name = "agentctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compact, bounded command and agent reports for LLM tool loops"
readme = "README.md"
documentation = "https://docs.rs/agentctl"
keywords = ["cli", "agents", "llm", "testing", "summary"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".ldgr/", "docs/"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.23"

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.20.0"

[workspace]
